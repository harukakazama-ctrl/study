            ctx.fillStyle = '#fff';
            ctx.fill();
            
            // まぶた
            ctx.beginPath();
            ctx.ellipse(x, y, size, size * 0.7, 0, Math.PI, Math.PI * 2);
            ctx.fillStyle = getPetAppearance().baseColor;
            ctx.fill();
            
            // 瞳
            ctx.beginPath();
            ctx.ellipse(x, y + size * 0.3, size * 0.25, size * 0.4, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#2d5a27';
            ctx.fill();
        }

        // 猫の鼻とマズル
        function drawCatNose(x, y, headSize) {
            // マズル（ふっくらした口元）
            // 左側のマズル
            ctx.beginPath();
            ctx.ellipse(x - headSize * 0.12, y + headSize * 0.18, headSize * 0.18, headSize * 0.12, 0, 0, Math.PI * 2);
            ctx.fillStyle = lightenColor('#f5f5f5', 10);
            ctx.fill();
            
            // 右側のマズル
            ctx.beginPath();
            ctx.ellipse(x + headSize * 0.12, y + headSize * 0.18, headSize * 0.18, headSize * 0.12, 0, 0, Math.PI * 2);
            ctx.fillStyle = lightenColor('#f5f5f5', 10);
            ctx.fill();
            
            // 鼻（オレンジ）
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - headSize * 0.08, y + headSize * 0.1);
            ctx.lineTo(x + headSize * 0.08, y + headSize * 0.1);
            ctx.closePath();
            ctx.fillStyle = '#FFB61D';
            ctx.fill();
        }

        // 猫の口
        function drawCatMouth(x, y, headSize, expression, actionTimer) {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            
            if (expression === 'eating') {
                // もぐもぐ（口を開閉）
                const openness = Math.abs(Math.sin(actionTimer * 0.5)) * headSize * 0.15;
                ctx.beginPath();
                ctx.ellipse(x, y + openness / 2, headSize * 0.1, openness, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#ff6b6b';
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else if (expression === 'petted' || expression === 'happy') {
                // 気持ちいい・幸せ（にっこり）
                ctx.beginPath();
                ctx.moveTo(x, y - headSize * 0.02);
                ctx.lineTo(x - headSize * 0.12, y + headSize * 0.08);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y - headSize * 0.02);
                ctx.lineTo(x + headSize * 0.12, y + headSize * 0.08);
                ctx.stroke();
            } else if (expression === 'playing') {
                // 遊び（わくわく、口を開けて）
                ctx.beginPath();
                ctx.arc(x, y + headSize * 0.05, headSize * 0.12, 0, Math.PI);
                ctx.fillStyle = '#ff6b6b';
                ctx.fill();
                ctx.stroke();
            } else if (expression === 'sad') {
                // 悲しい（への字）
                ctx.beginPath();
                ctx.moveTo(x - headSize * 0.1, y);
                ctx.quadraticCurveTo(x, y + headSize * 0.08, x + headSize * 0.1, y);
                ctx.stroke();
            } else if (expression === 'hungry') {
                // お腹が空いた（小さく口を開けて期待）
                ctx.beginPath();
                ctx.ellipse(x, y + headSize * 0.02, headSize * 0.06, headSize * 0.08, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#ff6b6b';
                ctx.fill();
                ctx.stroke();
            } else {
                // 通常の猫口（ω型）
                ctx.beginPath();
                ctx.moveTo(x, y - headSize * 0.02);
                ctx.lineTo(x - headSize * 0.1, y + headSize * 0.05);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y - headSize * 0.02);
                ctx.lineTo(x + headSize * 0.1, y + headSize * 0.05);
                ctx.stroke();
            }
        }

        // ひげ
        function drawWhiskers(x, y, headSize) {
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            
            // 左側のひげ
            for (let i = 0; i < 3; i++) {
                const angle = -0.2 + i * 0.15;
                ctx.beginPath();
                ctx.moveTo(x - headSize * 0.6, y + (i - 1) * 8);
                ctx.lineTo(x - headSize * 1.1, y + (i - 1) * 12 + Math.sin(angle) * 5);
                ctx.stroke();
            }
            
            // 右側のひげ
            for (let i = 0; i < 3; i++) {
                const angle = 0.2 - i * 0.15;
                ctx.beginPath();
                ctx.moveTo(x + headSize * 0.6, y + (i - 1) * 8);
                ctx.lineTo(x + headSize * 1.1, y + (i - 1) * 12 + Math.sin(angle) * 5);
                ctx.stroke();
            }
        }

        // 頬
        function drawCheeks(x, y, headSize, expression, level) {
            // なでられ中や幸せな時は頬を赤くする
            let blushIntensity = (expression === 'petted' || expression === 'happy' || expression === 'playing') ? 0.6 : 0.3;
            
            // Lv.2以上: 頬のピンクが濃くなる
            if (level >= 2) {
                blushIntensity += Math.min((level - 1) * 0.03, 0.2);
            }
            
            // Lv.2以上: 頬が少し大きくなる
            const cheekSize = level >= 2 ? 1 + Math.min((level - 1) * 0.05, 0.3) : 1;
            
            ctx.beginPath();
            ctx.ellipse(x - headSize * 0.55, y + headSize * 0.1, headSize * 0.15 * cheekSize, headSize * 0.1 * cheekSize, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 150, 150, ${blushIntensity})`;
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(x + headSize * 0.55, y + headSize * 0.1, headSize * 0.15 * cheekSize, headSize * 0.1 * cheekSize, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 150, 150, ${blushIntensity})`;
            ctx.fill();
        }

        // 王冠を描画
        function drawCrown(x, y) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.beginPath();
            ctx.moveTo(-25, 5);
            ctx.lineTo(-30, -20);
            ctx.lineTo(-15, -10);
            ctx.lineTo(0, -28);
            ctx.lineTo(15, -10);
            ctx.lineTo(30, -20);
            ctx.lineTo(25, 5);
            ctx.closePath();
            
            const crownGradient = ctx.createLinearGradient(0, -28, 0, 5);
            crownGradient.addColorStop(0, '#ffd700');
            crownGradient.addColorStop(1, '#ffaa00');
            ctx.fillStyle = crownGradient;
            ctx.fill();
            ctx.strokeStyle = '#cc8800';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 宝石
            ctx.beginPath();
            ctx.arc(0, -15, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#ff6b9d';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(-18, -8, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#4ecdc4';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(18, -8, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#4ecdc4';
            ctx.fill();
            
            ctx.restore();
        }

        // キラキラエフェクト
        function drawSparkles(headSize) {
            const time = Date.now() / 1000;
            const sparklePositions = [
                { x: -headSize * 1.3, y: -headSize * 0.8 },
                { x: headSize * 1.3, y: -headSize * 0.5 },
                { x: -headSize * 1.1, y: headSize * 0.5 },
                { x: headSize * 1.2, y: headSize * 0.7 }
            ];
            
            sparklePositions.forEach((pos, i) => {
                const phase = time * 2 + i * 1.5;
                const alpha = (Math.sin(phase) + 1) / 2 * 0.8;
                const scale = (Math.sin(phase) + 1) / 2 * 0.5 + 0.5;
                
                ctx.save();
                ctx.translate(pos.x, pos.y);
                ctx.scale(scale, scale);
                ctx.globalAlpha = alpha;
                
                // 星型
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(0, 10);
                ctx.moveTo(-10, 0);
                ctx.lineTo(10, 0);
                ctx.moveTo(-7, -7);
                ctx.lineTo(7, 7);
                ctx.moveTo(7, -7);
                ctx.lineTo(-7, 7);
                ctx.stroke();
                
                ctx.restore();
            });
        }

        // 色を明るくするヘルパー関数
        function lightenColor(hex, percent) {
            const num = parseInt(hex.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, (num >> 16) + amt);
            const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
            const B = Math.min(255, (num & 0x0000FF) + amt);
            return `rgb(${R}, ${G}, ${B})`;
        }

        // ============================================
        // UI更新関数
        // ============================================
        function updateUI() {
            const { hunger, happy, energy, level, exp, expToNext } = gameState;
            
            // ステータスバーを更新
            elements.hungerBar.style.width = `${hunger}%`;
            elements.hungerValue.textContent = Math.floor(hunger);
            
            elements.happyBar.style.width = `${happy}%`;
            elements.happyValue.textContent = Math.floor(happy);
            
            elements.energyBar.style.width = `${energy}%`;
            elements.energyValue.textContent = Math.floor(energy);
            
            // レベルと経験値を更新
            elements.levelBadge.textContent = `Lv.${level}`;
            elements.expBar.style.width = `${(exp / expToNext) * 100}%`;
            elements.expText.textContent = `${exp} / ${expToNext}`;
            
            // メッセージを更新
            updateMessage();
        }

        // メッセージを更新
        function updateMessage() {
            const { hunger, happy, energy, actionAnimation } = gameState;
            const avgStatus = (hunger + happy + energy) / 3;
            
            let message;
            
            // アクション中のメッセージ
            if (actionAnimation) {
                if (actionAnimation === 'eat') {
                    message = 'もぐもぐ... おいしい！🍖';
                } else if (actionAnimation === 'pet') {
                    message = 'きもちいい〜💖';
                } else if (actionAnimation === 'play') {
                    message = 'わーい！たのしい！🎾';
                }
            } else {
                // 状態に応じたメッセージ
                if (hunger < 20) {
                    message = 'おなかすいたよ...🍖';
                } else if (happy < 20) {
                    message = 'かまってほしいな...💔';
                } else if (energy < 20) {
                    message = 'つかれちゃった...😴';
                } else if (avgStatus >= 80) {
                    message = 'ごきげんだよ！✨';
                } else if (avgStatus >= 50) {
                    message = 'まあまあ元気！';
                } else {
                    message = 'ちょっとつかれた...';
                }
            }
            
            elements.petMessage.textContent = message;
        }

        // ============================================
        // ゲームロジック
        // ============================================
        
        // 時間経過によるステータス減少
        function decreaseStats(deltaTime) {
            // 1秒あたりの減少量（約2分で満腹が0になる程度）
            const decreaseRate = 0.8;
            
            gameState.hunger = Math.max(0, gameState.hunger - decreaseRate * deltaTime * 0.8);
            gameState.happy = Math.max(0, gameState.happy - decreaseRate * deltaTime * 0.6);
            
            // げんきはアクション中でない時に少しずつ回復
            if (!gameState.actionAnimation) {
                const recoveryRate = 0.3; // 1秒あたりの回復量
                gameState.energy = Math.min(100, gameState.energy + recoveryRate * deltaTime);
            }
        }

        // 経験値を追加してレベルアップを確認
        function addExp(amount) {
            gameState.exp += amount;
            
            // レベルアップ判定
            while (gameState.exp >= gameState.expToNext) {
                gameState.exp -= gameState.expToNext;
                gameState.level++;
                gameState.expToNext = Math.floor(gameState.expToNext * 1.5);
                
                // レベルごとの変化メッセージ
                let evolutionMsg = '';
                switch(gameState.level) {
                    case 2: evolutionMsg = ' 頬がピンクに！'; break;
                    case 3: evolutionMsg = ' 額に模様が！'; break;
                    case 4: evolutionMsg = ' 耳がふわふわに！'; break;
                    case 5: evolutionMsg = ' キラキラ輝き出した！'; break;
                    case 6: evolutionMsg = ' 首輪をゲット！'; break;
                    case 7: evolutionMsg = ' 毛並みがツヤツヤ！'; break;
                    case 8: evolutionMsg = ' 金の首輪に！'; break;
                    case 9: evolutionMsg = ' オーラが出てきた！'; break;
                    case 10: evolutionMsg = ' 👑 王冠をゲット！'; break;
                }
                
                // レベルアップメッセージ
                elements.petMessage.textContent = `🎉 Lv.${gameState.level}${evolutionMsg}`;
                
                // レベルアップ効果音 & 触覚フィードバック
                playSfx('levelup');
                hapticFeedback('success');
            }
        }

        // アクション：ごはん
        function feed() {
            if (gameState.actionAnimation) return;
            
            gameState.hunger = Math.min(100, gameState.hunger + 25);
            gameState.actionAnimation = 'eat';
            gameState.actionTimer = 0;
            addExp(20);
            
            setTimeout(() => {
                gameState.actionAnimation = null;
            }, 1500);
        }

        // アクション：なでる
        function pet() {
            if (gameState.actionAnimation) return;
            
            gameState.happy = Math.min(100, gameState.happy + 20);
            gameState.actionAnimation = 'pet';
            gameState.actionTimer = 0;
            addExp(16);
            
            setTimeout(() => {
                gameState.actionAnimation = null;
            }, 1500);
        }

        // アクション：あそぶ
        function play() {
            if (gameState.actionAnimation) return;
            
            // 体力を消費してごきげんを大幅アップ
            if (gameState.energy >= 10) {
                gameState.energy = Math.max(0, gameState.energy - 15);
                gameState.happy = Math.min(100, gameState.happy + 30);
                gameState.actionAnimation = 'play';
                gameState.actionTimer = 0;
                addExp(30);
                
                setTimeout(() => {
                    gameState.actionAnimation = null;
                }, 2000);
            } else {
                elements.petMessage.textContent = '体力がたりないよ...😢';
            }
        }

        // アクション：またたび
        function catnip() {
            if (gameState.actionAnimation) return;
            
            // げんきを1/3（約33）回復
            gameState.energy = Math.min(100, gameState.energy + 33);
            gameState.actionAnimation = 'pet';  // なでられた時と同じ表情
            gameState.actionTimer = 0;
            addExp(12);
            
            elements.petMessage.textContent = 'またたび〜♪ しあわせ〜';
            
            setTimeout(() => {
                gameState.actionAnimation = null;
            }, 1500);
        }

        // ============================================
        // メインゲームループ
        // ============================================
        let lastTime = 0;
        
        function gameLoop(currentTime) {
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            
            // アニメーション更新
            gameState.bounceOffset = Math.sin(currentTime / 500) * 3;
            
            // まばたき処理
            gameState.blinkTimer += deltaTime;
            if (!gameState.isBlinking && gameState.blinkTimer > 3 + Math.random() * 2) {
                gameState.isBlinking = true;
                gameState.blinkTimer = 0;
            } else if (gameState.isBlinking && gameState.blinkTimer > 0.15) {
                gameState.isBlinking = false;
                gameState.blinkTimer = 0;
            }
            
            // アクションアニメーションタイマー
            if (gameState.actionAnimation) {
                gameState.actionTimer += deltaTime * 20;
            }
            
            // 寝る/歩く切り替えタイマー（アクション中でない時のみ）
            if (!gameState.actionAnimation) {
                gameState.stateTimer += deltaTime;
                
                // 8秒ごとに状態を切り替え
                if (gameState.stateTimer > 8) {
                    gameState.stateTimer = 0;
                    gameState.petState = (gameState.petState === 'sleeping') ? 'walking' : 'sleeping';
                }
                
                // 歩行アニメーション更新
                if (gameState.petState === 'walking') {
                    gameState.walkCycle += deltaTime * 10;
                }
            }
            
            // ステータス減少（deltaTimeベース）
            decreaseStats(deltaTime);
            
            // 描画
            drawPet();
            updateUI();
            
            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // サウンドシステム（Web Audio API）
        // ============================================
        let audioCtx = null;
        let isBgmPlaying = false;
        let bgmInterval = null;
        let masterGain = null;

        // 音階の周波数テーブル
        const NOTE_FREQ = {
            'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23,
            'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
            'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46,
            'G5': 783.99, 'A5': 880.00, 'REST': 0
        };

        // BGMのメロディー（かわいい感じ）
        const BGM_MELODY = [
            { note: 'E4', duration: 0.25 },
            { note: 'G4', duration: 0.25 },
            { note: 'A4', duration: 0.25 },
            { note: 'G4', duration: 0.25 },
            { note: 'E4', duration: 0.25 },
            { note: 'C4', duration: 0.25 },
            { note: 'D4', duration: 0.25 },
            { note: 'E4', duration: 0.25 },
            { note: 'G4', duration: 0.25 },
            { note: 'A4', duration: 0.25 },
            { note: 'C5', duration: 0.5 },
            { note: 'REST', duration: 0.25 },
            { note: 'A4', duration: 0.25 },
            { note: 'G4', duration: 0.25 },
            { note: 'E4', duration: 0.25 },
            { note: 'D4', duration: 0.25 },
            { note: 'C4', duration: 0.5 },
            { note: 'REST', duration: 0.25 },
        ];

        // ベースライン
        const BGM_BASS = [
            { note: 'C4', duration: 1.0 },
            { note: 'G4', duration: 1.0 },
            { note: 'A4', duration: 1.0 },
            { note: 'E4', duration: 0.5 },
            { note: 'G4', duration: 0.5 },
        ];

        // AudioContextを初期化
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.3;
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 単音を再生
        function playNote(freq, duration, type = 'sine', volume = 0.3, startTime = 0) {
            if (!audioCtx || freq === 0) return;

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = type;
            oscillator.frequency.value = freq;

            // エンベロープ（ADSR風）
            const now = audioCtx.currentTime + startTime;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(volume, now + 0.02);
            gainNode.gain.linearRampToValueAtTime(volume * 0.7, now + 0.1);
            gainNode.gain.linearRampToValueAtTime(volume * 0.5, now + duration * 0.8);
            gainNode.gain.linearRampToValueAtTime(0, now + duration);

            oscillator.connect(gainNode);
            gainNode.connect(masterGain);

            oscillator.start(now);
            oscillator.stop(now + duration);
        }

        // 効果音を再生
        function playSfx(type) {
            initAudio();
            
            if (type === 'eat') {
                // もぐもぐ音
                playNote(NOTE_FREQ['E5'], 0.1, 'square', 0.2);
                setTimeout(() => playNote(NOTE_FREQ['G5'], 0.1, 'square', 0.2), 100);
                setTimeout(() => playNote(NOTE_FREQ['E5'], 0.1, 'square', 0.2), 200);
            } else if (type === 'pet') {
                // なでなで音
                playNote(NOTE_FREQ['C5'], 0.15, 'sine', 0.25);
                setTimeout(() => playNote(NOTE_FREQ['E5'], 0.15, 'sine', 0.25), 100);
                setTimeout(() => playNote(NOTE_FREQ['G5'], 0.2, 'sine', 0.25), 200);
            } else if (type === 'play') {
                // 遊ぶ音
                playNote(NOTE_FREQ['G4'], 0.1, 'square', 0.2);
                setTimeout(() => playNote(NOTE_FREQ['C5'], 0.1, 'square', 0.2), 80);
                setTimeout(() => playNote(NOTE_FREQ['E5'], 0.1, 'square', 0.2), 160);
                setTimeout(() => playNote(NOTE_FREQ['G5'], 0.2, 'square', 0.2), 240);
            } else if (type === 'levelup') {
                // レベルアップ音
                playNote(NOTE_FREQ['C5'], 0.15, 'square', 0.3);
                setTimeout(() => playNote(NOTE_FREQ['E5'], 0.15, 'square', 0.3), 100);
                setTimeout(() => playNote(NOTE_FREQ['G5'], 0.15, 'square', 0.3), 200);
                setTimeout(() => playNote(NOTE_FREQ['C5'] * 2, 0.4, 'square', 0.3), 300);
            }
        }

        // BGMを再生
        function playBgm() {
            let melodyIndex = 0;
            let bassIndex = 0;
            let melodyTime = 0;
            let bassTime = 0;

            function scheduleNext() {
                if (!isBgmPlaying) return;

                const now = audioCtx.currentTime;

                // メロディーをスケジュール
                if (melodyTime <= now + 0.5) {
                    const note = BGM_MELODY[melodyIndex];
                    if (note.note !== 'REST') {
                        playNote(NOTE_FREQ[note.note], note.duration * 0.9, 'square', 0.15, melodyTime - now);
                    }
                    melodyTime += note.duration;
                    melodyIndex = (melodyIndex + 1) % BGM_MELODY.length;
                }

                // ベースをスケジュール
                if (bassTime <= now + 0.5) {
                    const note = BGM_BASS[bassIndex];
                    playNote(NOTE_FREQ[note.note] / 2, note.duration * 0.9, 'triangle', 0.1, bassTime - now);
                    bassTime += note.duration;
                    bassIndex = (bassIndex + 1) % BGM_BASS.length;
                }

                bgmInterval = setTimeout(scheduleNext, 100);
            }

            melodyTime = audioCtx.currentTime;
            bassTime = audioCtx.currentTime;
            scheduleNext();
        }

        // BGMを停止
        function stopBgm() {
            if (bgmInterval) {
                clearTimeout(bgmInterval);
                bgmInterval = null;
            }
        }

        // BGMの切り替え
        function toggleBgm() {
            initAudio();
            
            const btn = document.getElementById('soundBtn');
            isBgmPlaying = !isBgmPlaying;

            if (isBgmPlaying) {
                btn.textContent = '🔊';
                btn.classList.remove('muted');
                playBgm();
            } else {
                btn.textContent = '🔇';
                btn.classList.add('muted');
                stopBgm();
            }
        }

        // ============================================
        // イベントリスナーの設定
        // ============================================
        // ============================================
        // 触覚フィードバック（HIG準拠）
        // ============================================
        function hapticFeedback(type = 'light') {
            // iOS/Androidの触覚フィードバック
            if ('vibrate' in navigator) {
                switch (type) {
                    case 'light':
                        navigator.vibrate(10);
                        break;
                    case 'medium':
                        navigator.vibrate(20);
                        break;
                    case 'heavy':
                        navigator.vibrate([30, 10, 30]);
                        break;
                    case 'success':
                        navigator.vibrate([10, 50, 20]);
                        break;
                }
            }
        }

        // ボタンイベント（触覚フィードバック付き）
        document.getElementById('btnFeed').addEventListener('click', () => {
            hapticFeedback('light');
            feed();
            playSfx('eat');
        });
        document.getElementById('btnPet').addEventListener('click', () => {
            hapticFeedback('light');
            pet();
            playSfx('pet');
        });
        document.getElementById('btnPlay').addEventListener('click', () => {
            hapticFeedback('medium');
            if (gameState.energy >= 10) {
                playSfx('play');
            }
            play();
        });
        document.getElementById('btnCatnip').addEventListener('click', () => {
            hapticFeedback('light');
            catnip();
            playSfx('pet');
        });
        document.getElementById('soundBtn').addEventListener('click', () => {
            hapticFeedback('light');
            toggleBgm();
        });

        // ============================================
        // ============================================
        // 日付・時間表示
        // ============================================
        const dateText = document.getElementById('dateText');
        const timeText = document.getElementById('timeText');
        
        function updateDateTime() {
            const now = new Date();
            
            // 日付（曜日付き）
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const day = days[now.getDay()];
            dateText.textContent = `${month}/${date}（${day}）`;
            
            // 時間
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            timeText.textContent = `${hours}:${minutes}`;
        }
        
        // 初回実行 & 毎分更新
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // ============================================
        // ゲーム開始
        // ============================================
        
        // 初期化処理
        resizeCanvas();
        initSnow();
        
        requestAnimationFrame(gameLoop);
        
        console.log('🐱 猫暮らしが起動しました！');
        console.log('📱 モバイル対応しています！');
        console.log('🎵 BGMボタンを押すと音楽が流れます！');
    </script>
</body>
</html>
