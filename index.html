<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#e0f0f5">
    <meta name="apple-mobile-web-app-title" content="猫暮らし">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
    <title>猫暮らし</title>
    <style>
        /* ============================================
           基本スタイル & カスタムプロパティ
           Apple Human Interface Guidelines準拠
        ============================================ */
        :root {
            /* SVGイラスト風カラーパレット */
            --bg-primary: #f0faf8;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e7eaee;
            --accent-mint: #64FCD9;
            --accent-orange: #FFB61D;
            --accent-pink: #ffb6c1;
            --accent-blue: #64b5f6;
            --accent-green: #64FCD9;
            --accent-red: #ff6b6b;
            --line-color: #00160A;
            --text-primary: #00160A;
            --text-secondary: #3c4a43;
            --text-tertiary: #8e9e93;
            --shadow-color: #e7eaee;
            --separator: rgba(0, 22, 10, 0.12);
            
            /* アニメーション */
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* ダークモード対応 */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #000000;
                --bg-secondary: #1c1c1e;
                --bg-tertiary: #2c2c2e;
                --text-primary: #ffffff;
                --text-secondary: #ebebf5;
                --text-tertiary: #8e8e93;
                --separator: rgba(84, 84, 88, 0.6);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Apple推奨のシステムフォント */
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
            /* Dynamic Type対応 */
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            background: linear-gradient(135deg, #e8faf6 0%, #d4f5ed 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available; /* iOS Safari対応 */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* タッチ操作の最適化 */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            /* セーフエリア対応 */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        html {
            height: -webkit-fill-available;
        }

        /* ============================================
           ゲームコンテナ
        ============================================ */
        .game-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: linear-gradient(180deg, #f0fdf9 0%, #e0f8f2 50%, #d4f2ea 100%);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 
                0 0 60px rgba(100, 252, 217, 0.25),
                inset 0 0 120px rgba(255, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* 背景のキラキラアニメーション */
        .game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255,200,150,0.4), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,220,180,0.3), transparent),
                radial-gradient(1px 1px at 90px 40px, rgba(255,180,120,0.5), transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,200,150,0.3), transparent),
                radial-gradient(1px 1px at 160px 120px, rgba(255,220,180,0.4), transparent);
            background-repeat: repeat;
            background-size: 200px 150px;
            animation: twinkle 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* ============================================
           ヘッダー（タイトル & レベル）
        ============================================ */
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .title {
            font-size: 1.4rem;
            font-weight: bold;
            background: linear-gradient(90deg, #e07050, #c06040);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .level-badge {
            background: linear-gradient(135deg, #64FCD9, #4de8c5);
            color: #00160A;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 2px 8px rgba(100, 252, 217, 0.4);
        }

        .sound-btn {
            background: rgba(0, 0, 0, 0.05);
            border: none;
            color: #666;
            font-size: 1.3rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sound-btn:hover {
            background: rgba(0, 0, 0, 0.1);
            transform: scale(1.1);
        }

        .sound-btn.muted {
            opacity: 0.5;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            position: absolute;
            right: 0;
        }

        .datetime-display {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            background: rgba(100, 252, 217, 0.2);
            border-radius: 10px;
            font-size: 0.8rem;
            border: 1px solid rgba(100, 252, 217, 0.3);
        }

        .date-text {
            color: #00160A;
            font-weight: 500;
        }

        .time-text {
            color: #00160A;
            font-weight: bold;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        /* ============================================
           ステータスバー
        ============================================ */
        .status-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-icon {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        .icon-hunger {
            color: #ff7b6b;
        }

        .icon-happy {
            color: #ff8fa0;
        }

        .icon-energy {
            color: #7bc96b;
        }

        .status-label {
            color: #666;
            font-size: 0.8rem;
            width: 65px;
            font-weight: bold;
        }

        .status-track {
            flex: 1;
            height: 12px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .status-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s ease, background 0.3s ease;
            position: relative;
        }

        .status-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.3), transparent);
            border-radius: 6px 6px 0 0;
        }

        .status-fill.hunger { background: linear-gradient(90deg, #ff6b6b, #ee5a5a); }
        .status-fill.happy { background: linear-gradient(90deg, #ffd93d, #f9c846); }
        .status-fill.energy { background: linear-gradient(90deg, #6bcb77, #4ade80); }

        .status-value {
            color: #444;
            font-size: 0.8rem;
            width: 35px;
            text-align: right;
            font-weight: bold;
        }

        /* ============================================
           キャンバス（ペット表示エリア）
        ============================================ */
        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        #petCanvas {
            border-radius: 20px;
        }

        /* ============================================
           ペットの名前 & メッセージ
        ============================================ */
        .pet-info {
            text-align: center;
            z-index: 1;
        }

        .pet-name-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .pet-name {
            font-size: 1.3rem;
            color: #00160A;
            font-weight: bold;
        }

        .pet-message {
            color: #FFB61D;
            font-size: 0.9rem;
            min-height: 1.2em;
            transition: opacity 0.3s ease;
        }

        /* ============================================
           アクションボタン（HIG準拠）
           - タッチターゲット: 最小44x44pt
           - 角丸: iOS標準の12-16pt
        ============================================ */
        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            z-index: 1;
            padding: 8px 0 10px;
        }

        .action-btn {
            flex: 1;
            max-width: 110px;
            /* HIG: 最小タッチターゲット 44x44pt */
            min-height: 64px;
            min-width: 64px;
            padding: 12px 8px;
            border: none;
            /* HIG: iOS標準の角丸 */
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            /* HIG: スムーズなアニメーション */
            transition: transform 0.15s var(--ease-out-expo), 
                        box-shadow 0.15s var(--ease-out-expo),
                        opacity 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            position: relative;
            overflow: hidden;
            /* HIG: タップ時のフィードバック準備 */
            -webkit-appearance: none;
            appearance: none;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent);
            pointer-events: none;
            border-radius: 16px 16px 0 0;
        }

        /* HIG: タップ時のフィードバック */
        .action-btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        /* PC用ホバー（タッチデバイスでは無効化） */
        @media (hover: hover) {
            .action-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            }
            .action-btn:active {
                transform: scale(0.98);
            }
        }

        .btn-feed {
            background: linear-gradient(135deg, #FFB61D, #f5a623);
            color: #00160A;
        }

        .btn-pet {
            background: linear-gradient(135deg, #ffb6c1, #ffa0ab);
            color: #00160A;
        }

        .btn-play {
            background: linear-gradient(135deg, #64FCD9, #4de8c5);
            color: #00160A;
        }

        .btn-catnip {
            background: linear-gradient(135deg, #a8e6cf, #88d8b0);
            color: #00160A;
        }

        .btn-icon {
            font-size: 1.5rem;
        }

        /* ============================================
           経験値バー
        ============================================ */
        .exp-container {
            z-index: 1;
        }

        .exp-label {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 0.75rem;
            margin-bottom: 5px;
        }

        .exp-track {
            height: 8px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .exp-fill {
            height: 100%;
            background: linear-gradient(90deg, #64FCD9, #FFB61D);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* ============================================
           モバイル対応 - レスポンシブデザイン
        ============================================ */
        
        /* 小さいスマホ（iPhone SE など） */
        @media screen and (max-height: 600px) {
            .game-container {
                padding: 10px;
                gap: 8px;
            }
            .title { font-size: 1.1rem; }
            .level-badge { padding: 3px 8px; font-size: 0.75rem; }
            .status-item { padding: 6px 10px; }
            .status-label { font-size: 0.65rem; }
            .status-value { font-size: 0.7rem; }
            .canvas-container { flex: 1; min-height: 180px; }
            .pet-name { font-size: 1rem; }
            .pet-message { font-size: 0.75rem; min-height: 35px; }
            .action-btn { padding: 10px 8px; font-size: 0.8rem; }
            .btn-icon { font-size: 1.2rem; }
            .exp-label { font-size: 0.65rem; }
        }
        
        /* 中くらいのスマホ */
        @media screen and (max-height: 700px) and (min-height: 601px) {
            .game-container {
                padding: 12px;
                gap: 10px;
            }
            .title { font-size: 1.2rem; }
            .canvas-container { flex: 1; min-height: 200px; }
            .pet-message { min-height: 40px; }
            .action-btn { padding: 12px 10px; }
        }

        /* 横向き対応 */
        @media screen and (orientation: landscape) and (max-height: 500px) {
            .game-container {
                flex-direction: row;
                flex-wrap: wrap;
                padding: 8px;
                gap: 8px;
                max-width: 100%;
                max-height: 100vh;
            }
            .header { width: 100%; }
            .status-container {
                width: 30%;
                flex-direction: column;
            }
            .canvas-container {
                width: 40%;
                min-height: 150px;
            }
            .pet-info { width: 100%; }
            .action-buttons { width: 25%; flex-direction: column; gap: 5px; }
            .action-btn { max-width: 100%; padding: 8px; }
            .exp-container { width: 100%; }
        }
        
        /* タッチデバイス用ホバー無効化 */
        @media (hover: none) {
            .action-btn:hover {
                transform: none;
                box-shadow: none;
            }
            .action-btn:active {
                transform: scale(0.95);
            }
            .sound-btn:hover {
                background: rgba(0, 0, 0, 0.05);
                transform: none;
            }
            .sound-btn:active {
                transform: scale(0.9);
            }
        }

        /* 大きい画面（タブレット・PC） */
        @media screen and (min-width: 768px) {
            .game-container {
                border-radius: 30px;
                max-width: 480px;
            }
        }

        /* ノッチ付きiPhone対応 */
        /* ノッチ付きiPhone対応 */
        @supports (padding-top: env(safe-area-inset-top)) {
            .game-container {
                padding-top: max(15px, env(safe-area-inset-top));
                padding-bottom: max(15px, env(safe-area-inset-bottom));
            }
        }

        /* HIG: モーション軽減設定対応（アクセシビリティ） */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .game-container::before {
                animation: none;
            }
        }

        /* HIG: ハイコントラストモード対応 */
        @media (prefers-contrast: more) {
            .action-btn {
                border: 2px solid currentColor;
            }
            .status-item {
                border: 1px solid var(--separator);
            }
        }

        /* HIG: フォーカス表示（キーボードナビゲーション） */
        .action-btn:focus-visible,
        .sound-btn:focus-visible {
            outline: 3px solid var(--accent-blue);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- ヘッダー -->
        <div class="header">
            <div class="datetime-display" id="datetimeDisplay">
                <div class="date-text" id="dateText"></div>
                <div class="time-text" id="timeText"></div>
            </div>
            <div class="header-right">
                <button class="sound-btn" id="soundBtn" title="BGM ON/OFF">🔇</button>
            </div>
        </div>

        <!-- ステータスバー -->
        <div class="status-container">
            <div class="status-bar">
                <span class="status-icon">🍙</span>
                <span class="status-label">おなか</span>
                <div class="status-track">
                    <div class="status-fill hunger" id="hungerBar" style="width: 100%"></div>
                </div>
                <span class="status-value" id="hungerValue">100</span>
            </div>
            <div class="status-bar">
                <span class="status-icon icon-happy">♥</span>
                <span class="status-label">ごきげん</span>
                <div class="status-track">
                    <div class="status-fill happy" id="happyBar" style="width: 100%"></div>
                </div>
                <span class="status-value" id="happyValue">100</span>
            </div>
            <div class="status-bar">
                <span class="status-icon icon-energy">★</span>
                <span class="status-label">げんき</span>
                <div class="status-track">
                    <div class="status-fill energy" id="energyBar" style="width: 100%"></div>
                </div>
                <span class="status-value" id="energyValue">100</span>
            </div>
        </div>

        <!-- ペット表示キャンバス -->
        <div class="canvas-container">
            <canvas id="petCanvas" width="300" height="300"></canvas>
        </div>

        <!-- ペット情報 -->
        <div class="pet-info">
            <div class="pet-name-row">
                <span class="pet-name" id="petName">たま</span>
                <span class="level-badge" id="levelBadge">Lv.1</span>
            </div>
            <div class="pet-message" id="petMessage">ごきげんだよ！</div>
        </div>

        <!-- 経験値バー -->
        <div class="exp-container">
            <div class="exp-label">
                <span>EXP</span>
                <span id="expText">0 / 100</span>
            </div>
            <div class="exp-track">
                <div class="exp-fill" id="expBar" style="width: 0%"></div>
            </div>
        </div>

        <!-- アクションボタン（HIG: アクセシビリティ対応） -->
        <div class="action-buttons" role="group" aria-label="ペットのお世話ボタン">
            <button class="action-btn btn-feed" id="btnFeed" 
                    aria-label="ごはんをあげる" 
                    tabindex="0">
                <span class="btn-icon" aria-hidden="true">🍖</span>
                <span>ごはん</span>
            </button>
            <button class="action-btn btn-pet" id="btnPet" 
                    aria-label="なでる" 
                    tabindex="0">
                <span class="btn-icon" aria-hidden="true">🤚</span>
                <span>なでる</span>
            </button>
            <button class="action-btn btn-play" id="btnPlay" 
                    aria-label="遊ぶ" 
                    tabindex="0">
                <span class="btn-icon" aria-hidden="true">🎾</span>
                <span>あそぶ</span>
            </button>
            <button class="action-btn btn-catnip" id="btnCatnip" 
                    aria-label="またたびをあげる" 
                    tabindex="0">
                <span class="btn-icon" aria-hidden="true">🌿</span>
                <span>またたび</span>
            </button>
        </div>
    </div>

    <script>
        // ============================================
        // ゲームの状態管理
        // ============================================
        const gameState = {
            // ステータス（0〜100）
            hunger: 100,    // 満腹度
            happy: 100,     // ごきげん
            energy: 100,    // 体力
            
            // 成長システム
            level: 1,       // 現在のレベル
            exp: 0,         // 現在の経験値
            expToNext: 100, // 次のレベルまでの経験値
            
            // アニメーション用
            bounceOffset: 0,     // 上下の揺れ
            blinkTimer: 0,       // まばたきタイマー
            isBlinking: false,   // まばたき中か
            actionAnimation: null, // アクションアニメーション
            actionTimer: 0,      // アクションタイマー
            
            // 寝る/歩く切り替え
            petState: 'sleeping',  // 'sleeping' または 'walking'
            stateTimer: 0,         // 状態タイマー
            walkCycle: 0           // 歩行アニメーション用
        };

        // ============================================
        // DOM要素の取得
        // ============================================
        const canvas = document.getElementById('petCanvas');
        const ctx = canvas.getContext('2d');
        
        // ============================================
        // キャンバスのリサイズ対応
        // ============================================
        // 論理サイズを保存（描画時に使用）
        let canvasLogicalWidth = 440;
        let canvasLogicalHeight = 350;
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            // コンテナのサイズに合わせてキャンバスを設定
            canvasLogicalWidth = Math.min(rect.width, 440);
            canvasLogicalHeight = Math.min(rect.height, 350);
            
            // 高解像度ディスプレイ対応
            canvas.width = canvasLogicalWidth * dpr;
            canvas.height = canvasLogicalHeight * dpr;
            canvas.style.width = canvasLogicalWidth + 'px';
            canvas.style.height = canvasLogicalHeight + 'px';
            
            // スケーリング
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            
            // 雪を再初期化
            if (typeof initSnow === 'function') {
                initSnow();
            }
        }
        
        // リサイズイベント（デバウンス付き）
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeCanvas, 100);
        });
        
        // 画面の向きが変わった時
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeCanvas, 200);
        });
        
        const elements = {
            hungerBar: document.getElementById('hungerBar'),
            hungerValue: document.getElementById('hungerValue'),
            happyBar: document.getElementById('happyBar'),
            happyValue: document.getElementById('happyValue'),
            energyBar: document.getElementById('energyBar'),
            energyValue: document.getElementById('energyValue'),
            levelBadge: document.getElementById('levelBadge'),
            expBar: document.getElementById('expBar'),
            expText: document.getElementById('expText'),
            petMessage: document.getElementById('petMessage'),
            petName: document.getElementById('petName')
        };

        // ============================================
        // ペットの見た目を決定する関数
        // ============================================
        function getPetAppearance() {
            const { level, hunger, happy, energy, actionAnimation } = gameState;
            const avgStatus = (hunger + happy + energy) / 3;
            
            // レベルに応じた見た目の変化（白猫ベース）
            let baseColor, accentColor, earInnerColor;
            
            // 白猫の基本色（純白）
            baseColor = '#ffffff';
            accentColor = '#f8f8f8';
            earInnerColor = '#ffb6c1';
            
            // アクション中は専用の表情
            let expression;
            if (actionAnimation === 'eat') {
                expression = 'eating';     // もぐもぐ
            } else if (actionAnimation === 'pet') {
                expression = 'petted';     // 気持ちいい
            } else if (actionAnimation === 'play') {
                expression = 'playing';    // わくわく
            } else if (happy <= 0) {
                expression = 'sad';        // ごきげんゼロ→悲しい
            } else if (hunger <= 0) {
                expression = 'hungry';     // おなかゼロ→お腹空いた
            } else if (avgStatus >= 80) {
                expression = 'happy';      // 元気いっぱい
            } else if (avgStatus >= 50) {
                expression = 'normal';     // 普通
            } else if (avgStatus >= 20) {
                expression = 'tired';      // 疲れてる
            } else {
                expression = 'sad';        // 悲しい
            }
            
            return { baseColor, accentColor, earInnerColor, expression, level };
        }

        // ============================================
        // 雪のパーティクル
        // ============================================
        const snowflakes = [];
        const SNOWFLAKE_COUNT = 60;
        
        // 雪の初期化
        function initSnow() {
            for (let i = 0; i < SNOWFLAKE_COUNT; i++) {
                snowflakes.push({
                    x: Math.random() * canvasLogicalWidth,
                    y: Math.random() * canvasLogicalHeight,
                    radius: Math.random() * 3 + 1,
                    speed: Math.random() * 1 + 0.5,
                    wind: Math.random() * 0.5 - 0.25,
                    opacity: Math.random() * 0.5 + 0.3
                });
            }
        }
        initSnow();
        
        // 雪を更新・描画
        function drawSnow() {
            snowflakes.forEach(flake => {
                // 描画
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${flake.opacity})`;
                ctx.fill();
                
                // 更新
                flake.y += flake.speed;
                flake.x += flake.wind + Math.sin(Date.now() / 1000 + flake.x) * 0.3;
                
                // 画面外に出たらリセット
                if (flake.y > canvasLogicalHeight) {
                    flake.y = -5;
                    flake.x = Math.random() * canvasLogicalWidth;
                }
                if (flake.x > canvasLogicalWidth) {
                    flake.x = 0;
                } else if (flake.x < 0) {
                    flake.x = canvasLogicalWidth;
                }
            });
        }

        // ============================================
        // 背景を描画する関数（日本家屋の縁側）
        // ============================================
        function drawBackground() {
            const w = canvasLogicalWidth;
            const h = canvasLogicalHeight;
            
            // 空のグラデーション（ミントグリーン系）
            const skyGradient = ctx.createLinearGradient(0, 0, 0, h * 0.5);
            skyGradient.addColorStop(0, '#b8f0e8');
            skyGradient.addColorStop(0.5, '#d4f5ed');
            skyGradient.addColorStop(1, '#e8faf6');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, w, h * 0.5);
            
            // 薄いドットパターン（背景全体）- ミントグリーン系
            ctx.fillStyle = 'rgba(100, 252, 217, 0.12)';
            const dotSpacing = 12;
            const dotRadius = 1.5;
            for (let x = 0; x < w; x += dotSpacing) {
                for (let y = 0; y < h; y += dotSpacing) {
                    ctx.beginPath();
                    ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // 冬の曇り空（太陽は雲の後ろ）
            ctx.beginPath();
            ctx.arc(w * 0.8, h * 0.15, 25, 0, Math.PI * 2);
            const sunGradient = ctx.createRadialGradient(w * 0.8, h * 0.15, 0, w * 0.8, h * 0.15, 40);
            sunGradient.addColorStop(0, 'rgba(255, 255, 240, 0.6)');
            sunGradient.addColorStop(0.5, 'rgba(255, 255, 240, 0.3)');
            sunGradient.addColorStop(1, 'rgba(255, 255, 240, 0)');
            ctx.fillStyle = sunGradient;
            ctx.fill();
            
            // 雲
            ctx.fillStyle = 'rgba(220, 230, 240, 0.7)';
            ctx.beginPath();
            ctx.arc(w * 0.2, h * 0.1, 25, 0, Math.PI * 2);
            ctx.arc(w * 0.25, h * 0.08, 20, 0, Math.PI * 2);
            ctx.arc(w * 0.3, h * 0.1, 22, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(w * 0.7, h * 0.12, 20, 0, Math.PI * 2);
            ctx.arc(w * 0.75, h * 0.1, 18, 0, Math.PI * 2);
            ctx.arc(w * 0.8, h * 0.12, 22, 0, Math.PI * 2);
            ctx.fill();
            
            // 庭（雪が積もった地面）
            const gardenGradient = ctx.createLinearGradient(0, h * 0.35, 0, h * 0.55);
            gardenGradient.addColorStop(0, '#e8eff5');
            gardenGradient.addColorStop(1, '#d8e5ed');
            ctx.fillStyle = gardenGradient;
            ctx.fillRect(0, h * 0.35, w, h * 0.2);
            
            // 雪の積もり方（波状）
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.moveTo(0, h * 0.38);
            for (let i = 0; i <= w; i += 15) {
                const snowY = Math.sin(i * 0.08) * 4 + h * 0.38;
                ctx.lineTo(i, snowY);
            }
            ctx.lineTo(w, h * 0.55);
            ctx.lineTo(0, h * 0.55);
            ctx.closePath();
            ctx.fill();
            
            // 庭石（雪をかぶっている）
            ctx.beginPath();
            ctx.ellipse(w * 0.2, h * 0.48, 20, 10, 0.1, 0, Math.PI * 2);
            ctx.fillStyle = '#778';
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(w * 0.2, h * 0.46, 15, 5, 0.1, 0, Math.PI);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(w * 0.75, h * 0.45, 15, 8, -0.2, 0, Math.PI * 2);
            ctx.fillStyle = '#667';
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(w * 0.75, h * 0.43, 12, 4, -0.2, 0, Math.PI);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fill();
            
            // 縁側の屋根の影
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, h * 0.5, w, h * 0.08);
            
            // 縁側（木の板）
            const engawaY = h * 0.55;
            const engawaGradient = ctx.createLinearGradient(0, engawaY, 0, h);
            engawaGradient.addColorStop(0, '#DEB887');
            engawaGradient.addColorStop(0.3, '#D2A679');
            engawaGradient.addColorStop(1, '#C19660');
            ctx.fillStyle = engawaGradient;
            ctx.fillRect(0, engawaY, w, h - engawaY);
            
            // 縁側の板目
            ctx.strokeStyle = 'rgba(139, 90, 43, 0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 8; i++) {
                const y = engawaY + (i + 1) * ((h - engawaY) / 8);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }
            
            // 木目模様
            ctx.strokeStyle = 'rgba(139, 90, 43, 0.15)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 15; i++) {
                const x = (i + 0.5) * (w / 15);
                ctx.beginPath();
                ctx.moveTo(x, engawaY);
                ctx.bezierCurveTo(x + 5, engawaY + 30, x - 5, engawaY + 60, x + 3, h);
                ctx.stroke();
            }
            
            // 障子（背景）
            const shoujiY = h * 0.02;
            const shoujiH = h * 0.35;
            
            // 障子の枠
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, shoujiY, w, 8);
            ctx.fillRect(0, shoujiY + shoujiH, w, 8);
            
            // 障子の紙部分
            ctx.fillStyle = '#FFF8E7';
            ctx.fillRect(0, shoujiY + 8, w, shoujiH - 8);
            
            // 障子の格子
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 3;
            const gridCols = 6;
            const gridRows = 3;
            const cellW = w / gridCols;
            const cellH = (shoujiH - 8) / gridRows;
            
            for (let i = 0; i <= gridCols; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellW, shoujiY + 8);
                ctx.lineTo(i * cellW, shoujiY + shoujiH);
                ctx.stroke();
            }
            for (let i = 0; i <= gridRows; i++) {
                ctx.beginPath();
                ctx.moveTo(0, shoujiY + 8 + i * cellH);
                ctx.lineTo(w, shoujiY + 8 + i * cellH);
                ctx.stroke();
            }
            
            // 障子の光（日差しが透けている）
            ctx.save();
            ctx.globalAlpha = 0.15;
            const lightGradient = ctx.createRadialGradient(w * 0.7, shoujiY + shoujiH * 0.5, 0, w * 0.7, shoujiY + shoujiH * 0.5, w * 0.5);
            lightGradient.addColorStop(0, '#FFD700');
            lightGradient.addColorStop(1, 'transparent');
            ctx.fillStyle = lightGradient;
            ctx.fillRect(0, shoujiY + 8, w, shoujiH - 8);
            ctx.restore();
            
            // 縁側に落ちる日差し（冬は薄く）
            ctx.save();
            ctx.globalAlpha = 0.1;
            ctx.beginPath();
            ctx.moveTo(w * 0.4, engawaY);
            ctx.lineTo(w * 0.9, engawaY);
            ctx.lineTo(w * 0.8, h);
            ctx.lineTo(w * 0.3, h);
            ctx.closePath();
            const sunlightGradient = ctx.createLinearGradient(w * 0.6, engawaY, w * 0.6, h);
            sunlightGradient.addColorStop(0, '#FFD700');
            sunlightGradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
            ctx.fillStyle = sunlightGradient;
            ctx.fill();
            ctx.restore();
            
            // 雪を描画
            drawSnow();
            
            // 縁側に積もった雪
            ctx.beginPath();
            ctx.moveTo(0, engawaY);
            for (let i = 0; i <= w; i += 20) {
                const snowHeight = Math.sin(i * 0.05) * 3 + 5;
                ctx.lineTo(i, engawaY - snowHeight);
            }
            ctx.lineTo(w, engawaY);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fill();
        }

        // ============================================
        // ペットを描画する関数（二頭身の猫）
        // ============================================
        function drawPet() {
            const { bounceOffset, isBlinking, actionAnimation, actionTimer } = gameState;
            const appearance = getPetAppearance();
            
            // キャンバスをクリア＆背景描画
            ctx.clearRect(0, 0, canvasLogicalWidth, canvasLogicalHeight);
            drawBackground();
            
            const centerX = canvasLogicalWidth / 2;
            const centerY = canvasLogicalHeight * 0.72;  // 縁側の位置に調整
            const { baseColor, accentColor, earInnerColor, expression, level } = appearance;
            
            // サイズ設定（レベルに応じて体が大きくなる）
            const headSize = 28 + Math.min(level, 3) * 22;
            const bodyWidth = headSize * 0.9;
            const bodyHeight = headSize * 0.5;
            
            // アクション中は起きている、それ以外は寝る/歩くを交互に
            const isSleeping = !actionAnimation && gameState.petState === 'sleeping';
            const isWalking = !actionAnimation && gameState.petState === 'walking';
            
            // アクションアニメーションのオフセット
            let actionOffsetX = 0;
            let actionOffsetY = 0;
            let rotation = 0;
            let tailWag = Math.sin(Date.now() / 500) * 0.15;
            
            if (actionAnimation === 'eat') {
                actionOffsetY = Math.sin(actionTimer * 0.5) * 5;
            } else if (actionAnimation === 'pet') {
                actionOffsetX = Math.sin(actionTimer * 0.3) * 5;
                rotation = Math.sin(actionTimer * 0.3) * 0.05;
            } else if (actionAnimation === 'play') {
                actionOffsetY = -Math.abs(Math.sin(actionTimer * 0.3)) * 25;
                tailWag = Math.sin(actionTimer * 0.5) * 0.6;
            }
            
            ctx.save();
            ctx.translate(centerX + actionOffsetX, centerY + (isSleeping ? 0 : bounceOffset) + actionOffsetY);
            ctx.rotate(rotation);
            
            if (isSleeping) {
                // 昼寝ポーズ（丸くなって寝ている）
                drawSleepingCat(0, 0, headSize, baseColor, accentColor, earInnerColor, level, isBlinking, expression);
            } else if (isWalking) {
                // 二足歩行ポーズ
                drawWalkingCat(0, 0, headSize, baseColor, accentColor, earInnerColor, level, isBlinking, gameState.walkCycle);
            } else {
                // 起きているポーズ（アクション中）
                drawAwakeCat(0, 0, headSize, baseColor, accentColor, earInnerColor, level, expression, isBlinking, actionTimer, tailWag);
            }
            
            ctx.restore();
        }

        // 昼寝している猫を描画
        function drawSleepingCat(x, y, headSize, baseColor, accentColor, earInnerColor, level, isBlinking, expression) {
            const sleepBreath = Math.sin(Date.now() / 600) * 6;  // 寝息で体が大きく動く
            
            // 影
            ctx.beginPath();
            ctx.ellipse(x, y + 25, headSize * 1.5, 12, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
            ctx.fill();
            
            // 丸まった体
            ctx.beginPath();
            ctx.ellipse(x + headSize * 0.3, y + sleepBreath, headSize * 1.2, headSize * 0.7, 0.1, 0, Math.PI * 2);
            const bodyGradient = ctx.createRadialGradient(x, y - headSize * 0.3, 0, x + headSize * 0.3, y, headSize * 1.2);
            bodyGradient.addColorStop(0, lightenColor(baseColor, 15));
            bodyGradient.addColorStop(0.6, baseColor);
            bodyGradient.addColorStop(1, accentColor);
            ctx.fillStyle = bodyGradient;
            ctx.fill();
            
            // しっぽ（均一な太さで体に巻き付いている・短め）
            const tailWave = Math.sin(Date.now() / 1000) * 0.08;
            ctx.save();
            ctx.translate(x + headSize * 0.9, y + headSize * 0.2);
            ctx.rotate(tailWave);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(headSize * 0.35, headSize * 0.2, headSize * 0.4, headSize * 0.45);
            ctx.quadraticCurveTo(headSize * 0.35, headSize * 0.65, headSize * 0.1, headSize * 0.7);
            ctx.strokeStyle = baseColor;
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.restore();
            
            // 前足（顔の下で重ねている）
            // 奥の前足
            ctx.beginPath();
            ctx.ellipse(x - headSize * 0.35, y + headSize * 0.4, headSize * 0.2, headSize * 0.12, -0.2, 0, Math.PI * 2);
            ctx.fillStyle = accentColor;
            ctx.fill();
            
            // 手前の前足
            ctx.beginPath();
            ctx.ellipse(x - headSize * 0.55, y + headSize * 0.35, headSize * 0.22, headSize * 0.14, -0.3, 0, Math.PI * 2);
            ctx.fillStyle = baseColor;
            ctx.fill();
            
            // 肉球
            ctx.beginPath();
            ctx.ellipse(x - headSize * 0.6, y + headSize * 0.45, headSize * 0.1, headSize * 0.06, 0, 0, Math.PI * 2);
            ctx.fillStyle = lightenColor(baseColor, 25);
            ctx.fill();
            
            // 頭（横向き、体の上に乗せている）
            ctx.save();
            ctx.translate(x - headSize * 0.5, y - headSize * 0.2 + sleepBreath * 0.5);
            ctx.rotate(-0.15);  // 少し傾ける
            
            // Lv.4以上: たてがみ
            drawMane(0, 0, headSize * 0.9, baseColor, level);
            
            // 耳
            drawCatEar(-headSize * 0.55, -headSize * 0.5, -0.35, headSize * 0.65, baseColor, earInnerColor);
            drawCatEar(headSize * 0.5, -headSize * 0.55, 0.2, headSize * 0.65, baseColor, earInnerColor);
            
            // 頭
            ctx.beginPath();
            ctx.ellipse(0, 0, headSize * 0.9, headSize * 0.8, 0, 0, Math.PI * 2);
            const headGradient = ctx.createRadialGradient(-headSize * 0.2, -headSize * 0.2, 0, 0, 0, headSize * 0.9);
            headGradient.addColorStop(0, lightenColor(baseColor, 20));
            headGradient.addColorStop(0.7, baseColor);
            headGradient.addColorStop(1, accentColor);
            ctx.fillStyle = headGradient;
            ctx.fill();
            
            // Lv.3以上: 額の模様
            if (level >= 3) {
                ctx.beginPath();
                ctx.moveTo(0, -headSize * 0.55);
                ctx.lineTo(-headSize * 0.12, -headSize * 0.3);
                ctx.lineTo(0, -headSize * 0.38);
                ctx.lineTo(headSize * 0.12, -headSize * 0.3);
                ctx.closePath();
                ctx.fillStyle = accentColor;
                ctx.fill();
            }
            
            // 閉じた目（寝ている）
            const eyeY = -headSize * 0.05;
            const eyeSpacing = headSize * 0.32;
            
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            
            // 左目（閉じている）
            ctx.beginPath();
            ctx.arc(-eyeSpacing, eyeY, headSize * 0.12, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();
            
            // 右目（閉じている）
            ctx.beginPath();
            ctx.arc(eyeSpacing, eyeY, headSize * 0.12, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();
            
            // マズル（ふっくらした口元）
            ctx.beginPath();
            ctx.ellipse(-headSize * 0.1, headSize * 0.28, headSize * 0.15, headSize * 0.1, 0, 0, Math.PI * 2);
            ctx.fillStyle = lightenColor(baseColor, 30);
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(headSize * 0.1, headSize * 0.28, headSize * 0.15, headSize * 0.1, 0, 0, Math.PI * 2);
            ctx.fillStyle = lightenColor(baseColor, 30);
            ctx.fill();
            
            // 鼻（オレンジ）
            ctx.beginPath();
            ctx.moveTo(0, headSize * 0.15);
            ctx.lineTo(-headSize * 0.06, headSize * 0.22);
            ctx.lineTo(headSize * 0.06, headSize * 0.22);
            ctx.closePath();
            ctx.fillStyle = '#FFB61D';
            ctx.fill();
            
            // 口（寝ている時の穏やかな口）
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, headSize * 0.24);
            ctx.lineTo(-headSize * 0.08, headSize * 0.3);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, headSize * 0.24);
            ctx.lineTo(headSize * 0.08, headSize * 0.3);
            ctx.stroke();
            
            // ひげ
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 1;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(-headSize * 0.55, headSize * 0.2 + (i - 1) * 6);
                ctx.lineTo(-headSize * 1.0, headSize * 0.18 + (i - 1) * 8);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(headSize * 0.55, headSize * 0.2 + (i - 1) * 6);
                ctx.lineTo(headSize * 1.0, headSize * 0.18 + (i - 1) * 8);
                ctx.stroke();
            }
            
            // 頬
            ctx.beginPath();
            ctx.ellipse(-headSize * 0.45, headSize * 0.1, headSize * 0.12, headSize * 0.08, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 150, 150, 0.35)';
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(headSize * 0.45, headSize * 0.1, headSize * 0.12, headSize * 0.08, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Lv.6以上: 首輪（寝ている時も見える部分）
            if (level >= 6) {
                ctx.beginPath();
                ctx.arc(0, headSize * 0.55, headSize * 0.4, 0.2 * Math.PI, 0.8 * Math.PI);
                ctx.strokeStyle = level >= 8 ? '#ffd700' : '#ff6b6b';
                ctx.lineWidth = 4;
                ctx.stroke();
                
                // 鈴
                ctx.beginPath();
                ctx.arc(0, headSize * 0.7, headSize * 0.08, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd700';
                ctx.fill();
                ctx.strokeStyle = '#daa520';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            ctx.restore();
            
            // 寝息の「zzz」（大きめでアニメーション）
            const zzzTime = Date.now() / 800;
            const zzzFloat = Math.sin(zzzTime) * 5;  // 上下に浮遊
            ctx.save();
            
            // 小さいz
            ctx.globalAlpha = (Math.sin(zzzTime) + 1) / 2 * 0.8;
            ctx.font = 'bold 18px sans-serif';
            ctx.fillStyle = '#7a8a9a';
            ctx.fillText('z', x - headSize * 1.0, y - headSize * 0.5 + zzzFloat);
            
            // 中くらいのz
            ctx.globalAlpha = (Math.sin(zzzTime + 0.5) + 1) / 2 * 0.85;
            ctx.font = 'bold 24px sans-serif';
            ctx.fillText('z', x - headSize * 1.25, y - headSize * 0.85 + zzzFloat * 0.8);
            
            // 大きいZ
            ctx.globalAlpha = (Math.sin(zzzTime + 1) + 1) / 2 * 0.9;
            ctx.font = 'bold 32px sans-serif';
            ctx.fillText('Z', x - headSize * 1.55, y - headSize * 1.25 + zzzFloat * 0.6);
            
            ctx.restore();
            
            // Lv.5以上: キラキラ（寝ていても少し光る）
            if (level >= 5) {
                ctx.save();
                ctx.translate(x - headSize * 0.5, y - headSize * 0.2);
                ctx.globalAlpha = 0.3 + (level - 5) * 0.1; // レベルが上がると輝きが増す
                drawSparkles(headSize * 0.5 + (level - 5) * 0.1 * headSize);
                ctx.restore();
            }
            
            // Lv.9以上: オーラ（寝ていても淡く）
            if (level >= 9) {
                ctx.save();
                ctx.globalAlpha = 0.15;
                const auraGradient = ctx.createRadialGradient(x, y, headSize * 0.3, x, y, headSize * 2);
                auraGradient.addColorStop(0, 'rgba(255, 215, 0, 0.3)');
                auraGradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
                ctx.fillStyle = auraGradient;
                ctx.beginPath();
                ctx.ellipse(x, y, headSize * 2, headSize * 1.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        // 二足歩行の猫を描画
        function drawWalkingCat(x, y, headSize, baseColor, accentColor, earInnerColor, level, isBlinking, walkCycle) {
            const bodyHeight = headSize * 1.2;
            const bodyWidth = headSize * 0.6;
            
            // 歩行アニメーション
            const walkBob = Math.sin(walkCycle * 0.15) * 5;  // 上下の揺れ
            const armSwing = Math.sin(walkCycle * 0.15) * 0.3;  // 腕の振り
            const legSwing = Math.sin(walkCycle * 0.15) * 0.4;  // 足の振り
            
            // 影を描画
            ctx.beginPath();
            ctx.ellipse(x, y + headSize * 1.5, bodyWidth * 0.8, 8, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fill();
            
            // しっぽ（後ろで揺れる）
            ctx.save();
            ctx.translate(x, y + headSize * 0.7);
            ctx.rotate(Math.sin(walkCycle * 0.1) * 0.2);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(headSize * 0.5, headSize * 0.3, headSize * 0.3, headSize * 0.7);
            ctx.strokeStyle = baseColor;
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.restore();
            
            // 後ろ足（右）
            ctx.save();
            ctx.translate(x + bodyWidth * 0.2, y + headSize * 0.9);
            ctx.rotate(legSwing);
            ctx.beginPath();
            ctx.ellipse(0, headSize * 0.35, headSize * 0.15, headSize * 0.35, 0, 0, Math.PI * 2);
            ctx.fillStyle = accentColor;
            ctx.fill();
            // 足先
            ctx.beginPath();
            ctx.ellipse(0, headSize * 0.7, headSize * 0.12, headSize * 0.08, 0, 0, Math.PI * 2);
            ctx.fillStyle = baseColor;
            ctx.fill();
            ctx.restore();
            
            // 後ろ足（左）
            ctx.save();
            ctx.translate(x - bodyWidth * 0.2, y + headSize * 0.9);
            ctx.rotate(-legSwing);
            ctx.beginPath();
            ctx.ellipse(0, headSize * 0.35, headSize * 0.15, headSize * 0.35, 0, 0, Math.PI * 2);
            ctx.fillStyle = accentColor;
            ctx.fill();
            // 足先
            ctx.beginPath();
            ctx.ellipse(0, headSize * 0.7, headSize * 0.12, headSize * 0.08, 0, 0, Math.PI * 2);
            ctx.fillStyle = baseColor;
            ctx.fill();
            ctx.restore();
            
            // 体（縦長の楕円）
            ctx.beginPath();
            ctx.ellipse(x, y + headSize * 0.3 + walkBob, bodyWidth, bodyHeight * 0.6, 0, 0, Math.PI * 2);
            const bodyGradient = ctx.createRadialGradient(x - bodyWidth * 0.3, y, 0, x, y + headSize * 0.3, bodyHeight);
            bodyGradient.addColorStop(0, lightenColor(baseColor, 15));
            bodyGradient.addColorStop(0.7, baseColor);
            bodyGradient.addColorStop(1, accentColor);
            ctx.fillStyle = bodyGradient;
            ctx.fill();
            
            // おなか（白っぽい部分）
            ctx.beginPath();
            ctx.ellipse(x, y + headSize * 0.45 + walkBob, bodyWidth * 0.5, bodyHeight * 0.4, 0, 0, Math.PI * 2);
            ctx.fillStyle = lightenColor(baseColor, 25);
            ctx.fill();
            
            // 腕（右）
            ctx.save();
            ctx.translate(x + bodyWidth * 0.6, y - headSize * 0.1 + walkBob);
            ctx.rotate(-armSwing);
            ctx.beginPath();
            ctx.ellipse(0, headSize * 0.25, headSize * 0.1, headSize * 0.25, 0.2, 0, Math.PI * 2);
            ctx.fillStyle = baseColor;
            ctx.fill();
            // 手
            ctx.beginPath();
            ctx.ellipse(headSize * 0.05, headSize * 0.5, headSize * 0.1, headSize * 0.08, 0, 0, Math.PI * 2);
            ctx.fillStyle = baseColor;
            ctx.fill();
            ctx.restore();
            
            // 腕（左）
            ctx.save();
            ctx.translate(x - bodyWidth * 0.6, y - headSize * 0.1 + walkBob);
            ctx.rotate(armSwing);
            ctx.beginPath();
            ctx.ellipse(0, headSize * 0.25, headSize * 0.1, headSize * 0.25, -0.2, 0, Math.PI * 2);
            ctx.fillStyle = baseColor;
            ctx.fill();
            // 手
            ctx.beginPath();
            ctx.ellipse(-headSize * 0.05, headSize * 0.5, headSize * 0.1, headSize * 0.08, 0, 0, Math.PI * 2);
            ctx.fillStyle = baseColor;
            ctx.fill();
            ctx.restore();
            
            // 頭（体の上）
            ctx.save();
            ctx.translate(x, y - headSize * 0.6 + walkBob);
            
            // たてがみ（Lv.4以上）
            drawMane(0, 0, headSize * 0.85, baseColor, level);
            
            // 耳
            const earScale = level >= 4 ? 1.1 : 1.0;
            drawCatEar(-headSize * 0.55, -headSize * 0.45, -0.25, headSize * 0.6 * earScale, baseColor, earInnerColor);
            drawCatEar(headSize * 0.55, -headSize * 0.45, 0.25, headSize * 0.6 * earScale, baseColor, earInnerColor);
            
            // 頭
            ctx.beginPath();
            ctx.ellipse(0, 0, headSize * 0.8, headSize * 0.75, 0, 0, Math.PI * 2);
            const headGradient = ctx.createRadialGradient(-headSize * 0.2, -headSize * 0.2, 0, 0, 0, headSize * 0.8);
            headGradient.addColorStop(0, lightenColor(baseColor, 20));
            headGradient.addColorStop(0.7, baseColor);
            headGradient.addColorStop(1, accentColor);
            ctx.fillStyle = headGradient;
            ctx.fill();
            
            // Lv.3以上: 額の模様
            if (level >= 3) {
                ctx.beginPath();
                ctx.moveTo(0, -headSize * 0.5);
                ctx.lineTo(-headSize * 0.12, -headSize * 0.25);
                ctx.lineTo(0, -headSize * 0.32);
                ctx.lineTo(headSize * 0.12, -headSize * 0.25);
                ctx.closePath();
                ctx.fillStyle = accentColor;
                ctx.fill();
            }
            
            // 目
            const eyeSpacing = headSize * 0.3;
            const eyeY = -headSize * 0.05;
            
            if (isBlinking) {
                drawClosedEye(-eyeSpacing, eyeY, headSize * 0.1);
                drawClosedEye(eyeSpacing, eyeY, headSize * 0.1);
            } else {
                // キラキラした目
                drawNormalEye(-eyeSpacing, eyeY, headSize * 0.13);
                drawNormalEye(eyeSpacing, eyeY, headSize * 0.13);
            }
            
            // マズル
            ctx.beginPath();
            ctx.ellipse(-headSize * 0.08, headSize * 0.22, headSize * 0.12, headSize * 0.08, 0, 0, Math.PI * 2);
            ctx.fillStyle = lightenColor(baseColor, 30);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(headSize * 0.08, headSize * 0.22, headSize * 0.12, headSize * 0.08, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 鼻
            ctx.beginPath();
            ctx.moveTo(0, headSize * 0.12);
            ctx.lineTo(-headSize * 0.05, headSize * 0.18);
            ctx.lineTo(headSize * 0.05, headSize * 0.18);
            ctx.closePath();
            ctx.fillStyle = '#FFB61D';
            ctx.fill();
            
            // 口（にっこり）
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, headSize * 0.2);
            ctx.lineTo(-headSize * 0.08, headSize * 0.28);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, headSize * 0.2);
            ctx.lineTo(headSize * 0.08, headSize * 0.28);
            ctx.stroke();
            
            // ひげ
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(-headSize * 0.45, headSize * 0.15 + (i - 1) * 5);
                ctx.lineTo(-headSize * 0.85, headSize * 0.12 + (i - 1) * 7);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(headSize * 0.45, headSize * 0.15 + (i - 1) * 5);
                ctx.lineTo(headSize * 0.85, headSize * 0.12 + (i - 1) * 7);
                ctx.stroke();
            }
            
            // 頬
            ctx.beginPath();
            ctx.ellipse(-headSize * 0.38, headSize * 0.08, headSize * 0.1, headSize * 0.07, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 150, 150, 0.4)';
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(headSize * 0.38, headSize * 0.08, headSize * 0.1, headSize * 0.07, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
            
            // Lv.6以上: 首輪
            if (level >= 6) {
                drawCollar(x, y - headSize * 0.15 + walkBob, headSize * 0.8, level);
            }
            
            // Lv.5以上: キラキラ
            if (level >= 5) {
                ctx.save();
                ctx.translate(x, y - headSize * 0.6 + walkBob);
                ctx.globalAlpha = 0.5 + (level - 5) * 0.1;
                drawSparkles(headSize * 0.5 + (level - 5) * 0.08 * headSize);
                ctx.restore();
            }
            
            // Lv.9以上: オーラ
            if (level >= 9) {
                ctx.save();
                ctx.globalAlpha = 0.2;
                const auraGradient = ctx.createRadialGradient(x, y, headSize * 0.3, x, y, headSize * 2);
                auraGradient.addColorStop(0, 'rgba(255, 215, 0, 0.3)');
                auraGradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
                ctx.fillStyle = auraGradient;
                ctx.beginPath();
                ctx.ellipse(x, y, headSize * 2, headSize * 1.8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            
            // Lv.10以上: 王冠
            if (level >= 10) {
                drawCrown(x, y - headSize * 1.35 + walkBob);
            }
        }

        // 起きている猫を描画
        function drawAwakeCat(x, y, headSize, baseColor, accentColor, earInnerColor, level, expression, isBlinking, actionTimer, tailWag) {
            const bodyWidth = headSize * 0.7;
            const bodyHeight = headSize * 0.6;
            
            // 影を描画
            ctx.beginPath();
            ctx.ellipse(x, y + headSize * 0.8, bodyWidth * 1.2, 8, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fill();
            
            // しっぽを描画
            drawTail(x + bodyWidth * 0.8, y + headSize * 0.3, baseColor, tailWag);
            
            // 体を描画
            drawBody(x, y + headSize * 0.3, bodyWidth, bodyHeight, baseColor, accentColor);
            
            // 後ろ足を描画
            drawLegs(x, y + headSize * 0.3 + bodyHeight * 0.5, bodyWidth * 0.8, baseColor);
            
            // 前足を描画
            drawFrontLegs(x, y + headSize * 0.55, baseColor);
            
            // 頭を描画
            drawHead(x, y - headSize * 0.4, headSize, baseColor, accentColor, earInnerColor, level);
            
            // 顔のパーツを描画
            const faceY = y - headSize * 0.4;
            drawCatEyes(x, faceY, headSize, expression, isBlinking, actionTimer);
            drawCatNose(x, faceY + headSize * 0.2, headSize);
            drawCatMouth(x, faceY + headSize * 0.35, headSize, expression, actionTimer);
            drawWhiskers(x, faceY + headSize * 0.25, headSize);
            drawCheeks(x, faceY + headSize * 0.15, headSize, expression, level);
            
            // レベルに応じた装飾
            // Lv.5以上: キラキラ
            if (level >= 5) {
                ctx.save();
                ctx.globalAlpha = 0.5 + (level - 5) * 0.1;
                drawSparkles(headSize * 0.6 + (level - 5) * 0.1 * headSize);
                ctx.restore();
            }
            
            // Lv.6以上: 首輪
            if (level >= 6) {
                drawCollar(x, y + headSize * 0.15, headSize, level);
            }
            
            // Lv.9以上: オーラ
            if (level >= 9) {
                ctx.save();
                ctx.globalAlpha = 0.2 + (level - 9) * 0.05;
                const auraGradient = ctx.createRadialGradient(x, y, headSize * 0.3, x, y, headSize * 2.5);
                auraGradient.addColorStop(0, 'rgba(255, 215, 0, 0.4)');
                auraGradient.addColorStop(0.5, 'rgba(255, 200, 100, 0.2)');
                auraGradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
                ctx.fillStyle = auraGradient;
                ctx.beginPath();
                ctx.ellipse(x, y, headSize * 2.5, headSize * 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            
            // Lv.10以上: 王冠
            if (level >= 10) {
                drawCrown(x, faceY - headSize * 0.85);
            }
        }

        // 猫の頭を描画
        function drawHead(x, y, size, baseColor, accentColor, earInnerColor, level) {
            ctx.save();
            ctx.translate(x, y);
            
            // Lv.4以上: たてがみを描画（頭の後ろに）
            drawMane(0, 0, size, baseColor, level);
            
            // 耳を描画（頭の後ろに）- 大きめの猫耳
            // Lv.4以上: 耳が少し大きくふわふわに
            const earScale = level >= 4 ? 1.1 : 1.0;
            drawCatEar(-size * 0.7, -size * 0.55, -0.25, size * 0.75 * earScale, baseColor, earInnerColor);
            drawCatEar(size * 0.7, -size * 0.55, 0.25, size * 0.75 * earScale, baseColor, earInnerColor);
            
            // 頭（少し縦長の楕円）
            ctx.beginPath();
            ctx.ellipse(0, 0, size, size * 0.9, 0, 0, Math.PI * 2);
            
            const headGradient = ctx.createRadialGradient(-size * 0.3, -size * 0.3, 0, 0, 0, size);
            headGradient.addColorStop(0, lightenColor(baseColor, 20));
            headGradient.addColorStop(0.7, baseColor);
            headGradient.addColorStop(1, accentColor);
            ctx.fillStyle = headGradient;
            ctx.fill();
            
            // Lv.3以上: 額の模様
            if (level >= 3) {
                ctx.beginPath();
                ctx.moveTo(0, -size * 0.6);
                ctx.lineTo(-size * 0.15, -size * 0.3);
                ctx.lineTo(0, -size * 0.4);
                ctx.lineTo(size * 0.15, -size * 0.3);
                ctx.closePath();
                ctx.fillStyle = accentColor;
                ctx.fill();
            }
            
            // Lv.7以上: 毛並みの光沢
            if (level >= 7) {
                ctx.beginPath();
                ctx.ellipse(-size * 0.3, -size * 0.2, size * 0.25, size * 0.15, -0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        // 首輪を描画
        function drawCollar(x, y, headSize, level) {
            ctx.save();
            
            // 首輪の色（レベルで変化）
            let collarColor = '#ff6b6b'; // Lv.6-7: 赤いリボン
            if (level >= 8) collarColor = '#ffd700'; // Lv.8以上: 金色
            
            // 首輪
            ctx.beginPath();
            ctx.ellipse(x, y, headSize * 0.35, headSize * 0.12, 0, 0, Math.PI * 2);
            ctx.strokeStyle = collarColor;
            ctx.lineWidth = 5;
            ctx.stroke();
            
            // 鈴
            const bellY = y + headSize * 0.15;
            ctx.beginPath();
            ctx.arc(x, bellY, headSize * 0.1, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd700';
            ctx.fill();
            ctx.strokeStyle = '#daa520';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            
            // 鈴の模様
            ctx.beginPath();
            ctx.moveTo(x - headSize * 0.05, bellY);
            ctx.lineTo(x + headSize * 0.05, bellY);
            ctx.strokeStyle = '#daa520';
            ctx.lineWidth = 1;
            ctx.stroke();
            
            ctx.restore();
        }

        // たてがみを描画（Lv.4以上）- 三角形のギザギザ
        function drawMane(x, y, headSize, baseColor, level) {
            if (level < 4) return;
            
            // レベルに応じてたてがみの長さと数が増える
            const maneLength = (level - 3) * 12;  // Lv4=12, Lv5=24, Lv6=36...
            const maneCount = 10 + (level - 4) * 3;  // ギザギザの数
            
            ctx.save();
            
            // たてがみの色（少し濃いめ）
            const maneColor = darkenColor(baseColor, 15);
            const maneColorLight = darkenColor(baseColor, 5);
            
            // 頭の周りにギザギザの三角形を描画
            for (let i = 0; i < maneCount; i++) {
                const angle = (Math.PI * 0.2) + (Math.PI * 1.6 / maneCount) * i;  // 上部から両サイドにかけて
                
                // 各三角形のゆらぎ
                const wave = Math.sin(Date.now() / 1000 + i * 0.5) * 2;
                
                // 三角形のサイズ（交互に大きさを変える）
                const sizeVariation = (i % 2 === 0) ? 1.0 : 0.7;
                const triLength = (maneLength + Math.sin(i * 0.8) * 8) * sizeVariation;
                const triWidth = (8 + (level - 4) * 3) * sizeVariation;  // 三角形の幅
                
                // 三角形の頂点を計算
                const baseX = x + Math.cos(angle) * headSize * 0.85;
                const baseY = y + Math.sin(angle) * headSize * 0.8;
                
                // 三角形の先端
                const tipX = baseX + Math.cos(angle) * triLength + wave;
                const tipY = baseY + Math.sin(angle) * triLength;
                
                // 三角形の両側の点
                const perpAngle = angle + Math.PI / 2;
                const leftX = baseX + Math.cos(perpAngle) * triWidth;
                const leftY = baseY + Math.sin(perpAngle) * triWidth;
                const rightX = baseX - Math.cos(perpAngle) * triWidth;
                const rightY = baseY - Math.sin(perpAngle) * triWidth;
                
                // 三角形を描画
                ctx.beginPath();
                ctx.moveTo(leftX, leftY);
                ctx.lineTo(tipX, tipY);
                ctx.lineTo(rightX, rightY);
                ctx.closePath();
                
                // グラデーションで立体感
                const gradient = ctx.createLinearGradient(baseX, baseY, tipX, tipY);
                gradient.addColorStop(0, maneColorLight);
                gradient.addColorStop(1, maneColor);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            ctx.restore();
        }

        // 猫耳を描画（大きくて尖った三角耳）
        function drawCatEar(x, y, angle, size, baseColor, innerColor) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            // 外側の耳（尖った三角形）
            ctx.beginPath();
            ctx.moveTo(0, -size * 0.8);  // 耳の先端（尖らせる）
            ctx.quadraticCurveTo(-size * 0.15, -size * 0.4, -size * 0.55, size * 0.35);  // 左側
            ctx.quadraticCurveTo(0, size * 0.2, size * 0.55, size * 0.35);  // 底辺
            ctx.quadraticCurveTo(size * 0.15, -size * 0.4, 0, -size * 0.8);  // 右側
            ctx.closePath();
            ctx.fillStyle = baseColor;
            ctx.fill();
            
            // 耳の縁取り
            ctx.strokeStyle = darkenColor(baseColor, 15);
            ctx.lineWidth = 1;
            ctx.stroke();
            
            // 内側の耳（ピンク）
            ctx.beginPath();
            ctx.moveTo(0, -size * 0.5);  // 内側の先端
            ctx.quadraticCurveTo(-size * 0.1, -size * 0.2, -size * 0.32, size * 0.2);
            ctx.quadraticCurveTo(0, size * 0.1, size * 0.32, size * 0.2);
            ctx.quadraticCurveTo(size * 0.1, -size * 0.2, 0, -size * 0.5);
            ctx.closePath();
            ctx.fillStyle = innerColor;
            ctx.fill();
            
            // 耳の毛（ふわふわ感）
            ctx.beginPath();
            ctx.moveTo(-size * 0.25, size * 0.3);
            ctx.quadraticCurveTo(-size * 0.1, size * 0.15, 0, size * 0.25);
            ctx.quadraticCurveTo(size * 0.1, size * 0.15, size * 0.25, size * 0.3);
            ctx.fillStyle = lightenColor(baseColor, 20);
            ctx.fill();
            
            ctx.restore();
        }
        
        // 色を暗くするヘルパー関数
        function darkenColor(hex, percent) {
            const num = parseInt(hex.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, (num >> 16) - amt);
            const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
            const B = Math.max(0, (num & 0x0000FF) - amt);
            return `rgb(${R}, ${G}, ${B})`;
        }

        // 体を描画
        function drawBody(x, y, width, height, baseColor, accentColor) {
            ctx.save();
            ctx.translate(x, y);
            
            // 体（楕円）
            ctx.beginPath();
            ctx.ellipse(0, height * 0.3, width, height, 0, 0, Math.PI * 2);
            
            const bodyGradient = ctx.createRadialGradient(-width * 0.2, 0, 0, 0, height * 0.3, height);
            bodyGradient.addColorStop(0, lightenColor(baseColor, 15));
            bodyGradient.addColorStop(0.6, baseColor);
            bodyGradient.addColorStop(1, accentColor);
            ctx.fillStyle = bodyGradient;
            ctx.fill();
            
            // お腹の白い部分
            ctx.beginPath();
            ctx.ellipse(0, height * 0.4, width * 0.5, height * 0.6, 0, 0, Math.PI * 2);
            ctx.fillStyle = lightenColor(baseColor, 40);
            ctx.fill();
            
            ctx.restore();
        }

        // 足を描画
        function drawLegs(x, y, bodyWidth, baseColor) {
            ctx.save();
            ctx.translate(x, y);
            
            // 前足
            ctx.beginPath();
            ctx.ellipse(-bodyWidth * 0.5, 15, 12, 18, -0.2, 0, Math.PI * 2);
            ctx.fillStyle = baseColor;
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(bodyWidth * 0.5, 15, 12, 18, 0.2, 0, Math.PI * 2);
            ctx.fillStyle = baseColor;
            ctx.fill();
            
            // 肉球っぽい先端
            ctx.beginPath();
            ctx.ellipse(-bodyWidth * 0.5, 30, 10, 6, 0, 0, Math.PI * 2);
            ctx.fillStyle = lightenColor(baseColor, 30);
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(bodyWidth * 0.5, 30, 10, 6, 0, 0, Math.PI * 2);
            ctx.fillStyle = lightenColor(baseColor, 30);
            ctx.fill();
            
            ctx.restore();
        }

        // しっぽを描画（均一な太さ）
        function drawTail(x, y, baseColor, wagAngle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(wagAngle);
            
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(22, -12, 28, -30);
            ctx.quadraticCurveTo(30, -45, 22, -55);
            ctx.strokeStyle = baseColor;
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.stroke();
            
            ctx.restore();
        }
        
        // 前足を描画
        function drawFrontLegs(x, y, baseColor) {
            // 左前足
            ctx.beginPath();
            ctx.ellipse(x - 18, y, 10, 16, -0.15, 0, Math.PI * 2);
            ctx.fillStyle = baseColor;
            ctx.fill();
            
            // 右前足
            ctx.beginPath();
            ctx.ellipse(x + 18, y, 10, 16, 0.15, 0, Math.PI * 2);
            ctx.fillStyle = baseColor;
            ctx.fill();
            
            // 肉球（左）
            ctx.beginPath();
            ctx.ellipse(x - 18, y + 12, 7, 5, 0, 0, Math.PI * 2);
            ctx.fillStyle = lightenColor(baseColor, 20);
            ctx.fill();
            
            // 肉球（右）
            ctx.beginPath();
            ctx.ellipse(x + 18, y + 12, 7, 5, 0, 0, Math.PI * 2);
            ctx.fillStyle = lightenColor(baseColor, 20);
            ctx.fill();
        }

        // 猫の目を描画
        function drawCatEyes(x, y, headSize, expression, isBlinking, actionTimer) {
            const eyeSpacing = headSize * 0.4;
            const eyeY = y - headSize * 0.1;
            
            ctx.save();
            
            // 表情に応じた目の描画
            if (isBlinking) {
                // まばたき
                drawClosedEye(-eyeSpacing, eyeY, headSize * 0.12);
                drawClosedEye(eyeSpacing, eyeY, headSize * 0.12);
            } else if (expression === 'eating') {
                // もぐもぐ：目を細める（幸せそう）
                const squint = Math.abs(Math.sin(actionTimer * 0.5));
                drawSquintEye(-eyeSpacing, eyeY, headSize * 0.15, squint);
                drawSquintEye(eyeSpacing, eyeY, headSize * 0.15, squint);
            } else if (expression === 'petted') {
                // なでられ：とろーんとした目
                drawDrowsyEye(-eyeSpacing, eyeY, headSize * 0.15);
                drawDrowsyEye(eyeSpacing, eyeY, headSize * 0.15);
            } else if (expression === 'playing') {
                // 遊び：キラキラした目
                drawExcitedEye(-eyeSpacing, eyeY, headSize * 0.18, actionTimer);
                drawExcitedEye(eyeSpacing, eyeY, headSize * 0.18, actionTimer);
            } else if (expression === 'happy') {
                // 幸せ：笑顔の目
                drawClosedEye(-eyeSpacing, eyeY, headSize * 0.12);
                drawClosedEye(eyeSpacing, eyeY, headSize * 0.12);
            } else if (expression === 'sad') {
                // 悲しい：潤んだ目（涙目）
                drawSadEye(-eyeSpacing, eyeY, headSize * 0.14);
                drawSadEye(eyeSpacing, eyeY, headSize * 0.14);
                // 涙
                ctx.fillStyle = 'rgba(100, 180, 255, 0.6)';
                ctx.beginPath();
                ctx.ellipse(-eyeSpacing + headSize * 0.08, eyeY + headSize * 0.2, 3, 5, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (expression === 'hungry') {
                // お腹が空いた：うるうるした期待の目
                drawHungryEye(-eyeSpacing, eyeY, headSize * 0.15);
                drawHungryEye(eyeSpacing, eyeY, headSize * 0.15);
            } else if (expression === 'tired') {
                // 疲れ：半目
                drawTiredEye(-eyeSpacing, eyeY, headSize * 0.13);
                drawTiredEye(eyeSpacing, eyeY, headSize * 0.13);
            } else {
                // 通常
                drawNormalEye(-eyeSpacing, eyeY, headSize * 0.15);
                drawNormalEye(eyeSpacing, eyeY, headSize * 0.15);
            }
            
            ctx.restore();
        }

        // 通常の目
        function drawNormalEye(x, y, size) {
            // 白目
            ctx.beginPath();
            ctx.ellipse(x, y, size, size * 1.2, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            
            // 瞳（縦長の猫目）
            ctx.beginPath();
            ctx.ellipse(x, y, size * 0.4, size * 0.9, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#2d5a27';
            ctx.fill();
            
            // 瞳孔
            ctx.beginPath();
            ctx.ellipse(x, y, size * 0.15, size * 0.7, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#111';
            ctx.fill();
            
            // ハイライト
            ctx.beginPath();
            ctx.arc(x - size * 0.2, y - size * 0.3, size * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        }

        // 閉じた目（笑顔）
        function drawClosedEye(x, y, size) {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(x, y, size, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();
        }

        // 細めた目（糸目・幸せそうな閉じ目）
        function drawSquintEye(x, y, size, squint) {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            
            // 糸目（上向きの弧・にっこり・大きめ）
            ctx.beginPath();
            ctx.arc(x, y, size * 1.2, 1.15 * Math.PI, 1.85 * Math.PI);
            ctx.stroke();
        }

        // とろーんとした目
        function drawDrowsyEye(x, y, size) {
            // 半分閉じた目
            ctx.beginPath();
            ctx.ellipse(x, y + size * 0.2, size, size * 0.5, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            
            // まぶた
            ctx.beginPath();
            ctx.ellipse(x, y - size * 0.1, size * 1.1, size * 0.6, 0, Math.PI, Math.PI * 2);
            ctx.fillStyle = getPetAppearance().baseColor;
            ctx.fill();
            
            // 瞳
            ctx.beginPath();
            ctx.ellipse(x, y + size * 0.2, size * 0.3, size * 0.4, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#2d5a27';
            ctx.fill();
        }

        // キラキラした目
        function drawExcitedEye(x, y, size, timer) {
            const sparkle = Math.sin(timer * 0.5) * 0.2 + 1;
            
            // 大きな目
            ctx.beginPath();
            ctx.ellipse(x, y, size * sparkle, size * 1.2 * sparkle, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            
            // 瞳
            ctx.beginPath();
            ctx.ellipse(x, y, size * 0.5, size * 0.9, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#2d5a27';
            ctx.fill();
            
            // 大きなハイライト（キラキラ）
            ctx.beginPath();
            ctx.arc(x - size * 0.25, y - size * 0.35, size * 0.35, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            
            // 小さなハイライト
            ctx.beginPath();
            ctx.arc(x + size * 0.2, y + size * 0.2, size * 0.15, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        }

        // 悲しい目
        function drawSadEye(x, y, size) {
            // 潤んだ目
            ctx.beginPath();
            ctx.ellipse(x, y, size, size * 1.1, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            
            // 瞳（少し上を向く）
            ctx.beginPath();
            ctx.ellipse(x, y - size * 0.1, size * 0.4, size * 0.8, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#2d5a27';
            ctx.fill();
            
            // 涙
            ctx.beginPath();
            ctx.ellipse(x + size * 0.7, y + size * 0.5, 4, 7, 0.3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(100, 200, 255, 0.7)';
            ctx.fill();
            
            // 眉毛（困り眉）
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x - size * 0.8, y - size * 0.8);
            ctx.lineTo(x + size * 0.3, y - size * 1.1);
            ctx.stroke();
        }

        // お腹が空いた目（うるうる期待）
        function drawHungryEye(x, y, size) {
            // 大きな期待の目
            ctx.beginPath();
            ctx.ellipse(x, y, size * 1.1, size * 1.3, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            
            // 瞳（大きめ、上目遣い）
            ctx.beginPath();
            ctx.ellipse(x, y + size * 0.1, size * 0.5, size * 1.0, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#2d5a27';
            ctx.fill();
            
            // 瞳孔
            ctx.beginPath();
            ctx.ellipse(x, y + size * 0.1, size * 0.2, size * 0.8, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#111';
            ctx.fill();
            
            // キラキラハイライト（期待感）
            ctx.beginPath();
            ctx.arc(x - size * 0.25, y - size * 0.2, size * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(x + size * 0.15, y + size * 0.3, size * 0.15, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fill();
        }

        // 疲れた目
        function drawTiredEye(x, y, size) {
            // 半目
            ctx.beginPath();
            ctx.ellipse(x, y + size * 0.3, size * 0.9, size * 0.5, 0, 0, Math.PI * 2);
